name: Circuit design verification

on:
  push:
    paths:
      - "SKILL.md"
      - "README.md"
      - "scripts/**"
      - "schemas/**"
      - "catalog/**"
      - "examples/**"
      - "tests/**"
      - "references/**"
      - "templates/**"
      - ".github/workflows/design.yml"
  pull_request:
    paths:
      - "SKILL.md"
      - "README.md"
      - "scripts/**"
      - "schemas/**"
      - "catalog/**"
      - "examples/**"
      - "tests/**"
      - "references/**"
      - "templates/**"
      - ".github/workflows/design.yml"
  workflow_dispatch:
    inputs:
      spec:
        description: "Design spec to verify (repo-relative path)"
        required: false
        default: "examples/rc-lowpass.json"
        type: string
      require:
        description: "Comma-separated stages that must PASS (design,simulate,erc,kicad-parse,models)"
        required: false
        default: "simulate,erc"
        type: string
      live_model:
        description: "Fetch a real model and simulate it (network required)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SPEC: ${{ github.event.inputs.spec || 'examples/rc-lowpass.json' }}
  REQUIRE: ${{ github.event.inputs.require || 'simulate,design' }}

jobs:
  tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional parser
        run: python -m pip install --upgrade pip kiutils
      - name: Install ngspice
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ngspice
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

  cross-repo:
    name: Audio handoff merge
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check out the audio skill
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: davlug3/audio-engineering-skill
          path: audio-engineering-skill

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate the audio handoff
        run: |
          python audio-engineering-skill/scripts/source_check.py \
            --root audio-engineering-skill --strict \
            --handoff audio-engineering-skill/examples/mic-preamp-handoff.json

      - name: Merge and validate the circuit spec
        run: |
          set -euo pipefail
          mkdir -p out-cross
          python scripts/audio_handoff.py \
            --handoff audio-engineering-skill/examples/mic-preamp-handoff.json \
            --base examples/mic-preamp-base.json \
            --map examples/mic-preamp-map.json \
            --audio-skill audio-engineering-skill --require-registry \
            --out out-cross/mic-preamp-merged.json
          python scripts/design_spec.py validate out-cross/mic-preamp-merged.json

      - name: Upload the merged spec
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audio-handoff-merge
          path: out-cross/
          if-no-files-found: warn
          retention-days: 30

  verify:
    name: Generate and verify
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install KiCad 9 and ngspice
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends kicad ngspice
          kicad-cli version
          ngspice -v | head -3

      - name: Install optional parser
        run: python -m pip install --upgrade pip kiutils

      - name: Probe this machine
        run: python scripts/env_probe.py --spec "$SPEC"

      - name: Generate and verify
        env:
          CIRCUIT_BACKEND: ci
        run: |
          set -euo pipefail
          if [[ "$REQUIRE" == *erc* ]]; then ERC="--erc"; else ERC=""; fi
          python scripts/verify.py "$SPEC" --out out --json \
            --require "$REQUIRE" $ERC | tee verification.json

      - name: Render schematic image
        run: |
          set -euo pipefail
          shopt -s nullglob
          schematics=(out/*.kicad_sch)
          if (( ${#schematics[@]} )); then
            python scripts/render_schematic.py "${schematics[0]}" --out out/images
          else
            echo "No KiCad schematic requested by this spec; image export skipped."
          fi

      - name: Verify TPS5430 reference schematic
        env:
          CIRCUIT_BACKEND: ci
        run: |
          set -euo pipefail
          python scripts/verify.py examples/tps5430-12v-5v-2a.json \
            --out out-tps5430 --json --require design,kicad-parse \
            | tee tps5430-verification.json

      - name: Render TPS5430 schematic
        run: |
          set -euo pipefail
          schematics=(out-tps5430/*.kicad_sch)
          if (( ${#schematics[@]} )); then
            python scripts/render_schematic.py "${schematics[0]}" --out out-tps5430/images
          else
            echo "TPS5430 schematic was not generated." >&2
            exit 1
          fi
      - name: Verify gain and bandwidth metrics
        env:
          CIRCUIT_BACKEND: ci
        run: |
          set -euo pipefail
          python scripts/verify.py examples/rc-lowpass-metrics.json \
            --out out-metrics --json --require simulate \
            | tee metrics-verification.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: circuit-verification
          path: |
            out/
            out/images/
            out-tps5430/
            tps5430-verification.json
            out-metrics/
            verification.json
            metrics-verification.json
          if-no-files-found: warn
          retention-days: 30

  live-model:
    name: Live model fetch and simulation
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.live_model == 'true'
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install ngspice
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ngspice
      - name: Fetch a published model and simulate it
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/live-model"
          mkdir -p "$work"
          cat > "$work/ce.json" <<'JSON'
          {
            "name": "live_model_ce",
            "description": "common-emitter stage with a model fetched from the catalog",
            "ground": "GND",
            "deliverables": ["spice", "report"],
            "analyses": [
              {"type": "op"},
              {"type": "ac", "start": 10, "stop": 1000000, "points": 20}
            ],
            "components": [
              {"ref": "V1", "type": "V", "value": 12, "pins": {"1": "VCC", "2": "GND"}},
              {"ref": "V2", "type": "V", "value": 0, "dc": 0, "ac": 1, "pins": {"1": "VIN", "2": "GND"}},
              {"ref": "R1", "type": "R", "value": 100000, "pins": {"1": "VCC", "2": "VB"}},
              {"ref": "R2", "type": "R", "value": 20000, "pins": {"1": "VB", "2": "GND"}},
              {"ref": "RC", "type": "R", "value": 4700, "pins": {"1": "VCC", "2": "VC"}},
              {"ref": "RE", "type": "R", "value": 1000, "pins": {"1": "VE", "2": "GND"}},
              {"ref": "C1", "type": "C", "value": 1e-6, "pins": {"1": "VIN", "2": "VB"}},
              {"ref": "C2", "type": "C", "value": 1e-6, "pins": {"1": "VC", "2": "VOUT"}},
              {"ref": "RL", "type": "R", "value": 10000, "pins": {"1": "VOUT", "2": "GND"}},
              {"ref": "Q1", "type": "NPN", "value": 0, "pins": {"1": "VC", "2": "VB", "3": "VE"}}
            ]
          }
          JSON
          python scripts/model_fetch.py --part 2N3904 \
            --write-spec "$work/ce.json" --ref Q1 --out "$work/models"
          python scripts/verify.py "$work/ce.json" --out "$work/out" \
            --require models,simulate --json | tee "$work/verification.json"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-model-verification
          path: ${{ runner.temp }}/live-model/verification.json
          if-no-files-found: warn
          retention-days: 30
