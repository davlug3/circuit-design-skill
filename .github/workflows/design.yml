name: Circuit design verification

on:
  push:
    paths:
      - "scripts/**"
      - "schemas/**"
      - "examples/**"
      - "tests/**"
      - ".github/workflows/design.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "schemas/**"
      - "examples/**"
      - "tests/**"
      - ".github/workflows/design.yml"
  workflow_dispatch:
    inputs:
      spec:
        description: "Design spec to verify (repo-relative path)"
        required: false
        default: "examples/rc-lowpass.json"
        type: string
      require:
        description: "Comma-separated stages that must PASS (simulate,erc,kicad-parse)"
        required: false
        default: "simulate,erc"
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SPEC: ${{ github.event.inputs.spec || 'examples/rc-lowpass.json' }}
  REQUIRE: ${{ github.event.inputs.require || 'simulate' }}

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional parser
        run: python -m pip install --upgrade pip kiutils
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v

  verify:
    name: Generate and verify
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install KiCad 9 and ngspice
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends kicad ngspice
          kicad-cli version
          ngspice -v | head -3

      - name: Install optional parser
        run: python -m pip install --upgrade pip kiutils

      - name: Probe this machine
        run: python scripts/env_probe.py --spec "$SPEC"

      - name: Generate and verify
        env:
          CIRCUIT_BACKEND: ci
        run: |
          if [[ "$REQUIRE" == *erc* ]]; then ERC="--erc"; else ERC=""; fi
          python scripts/verify.py "$SPEC" --out out --json \
            --require "$REQUIRE" $ERC | tee verification.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circuit-verification
          path: |
            out/
            verification.json
          if-no-files-found: warn
          retention-days: 30
